<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Dark Blue to Neon Purple & Cyan Mix Gradient -->
    <linearGradient id="ciqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>   <!-- Cyan -->
      <stop offset="35%" stop-color="#2563eb"/>  <!-- Dark Royal Blue -->
      <stop offset="70%" stop-color="#7c3aed"/>  <!-- Neon Purple -->
      <stop offset="100%" stop-color="#e0e7ff"/> <!-- Specular Cyan-White -->
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Background rounded square -->
  <rect width="512" height="512" rx="128" fill="url(#bgDarkSpace)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#ciqGrad)" stroke-width="6" stroke-dasharray="24 16" opacity="0.65"/>

  <!-- Stylized c.iq Lettering with Glowing Dots -->
  <g filter="url(#glowEffect)">
    <!-- Stylized 'c' Arc -->
    <path d="M 180,210 C 120,210 110,310 180,310 C 200,310 215,300 225,285" 
          fill="none" 
          stroke="url(#ciqGrad)" 
          stroke-width="32" 
          stroke-linecap="round"/>

    <!-- Glowing Dot '.' -->
    <circle cx="256" cy="305" r="14" fill="#38bdf8"/>

    <!-- Stylized 'i' Stem -->
    <line x1="295" y1="230" x2="295" y2="310" stroke="url(#ciqGrad)" stroke-width="32" stroke-linecap="round"/>
    <circle cx="295" cy="185" r="16" fill="#a855f7"/>

    <!-- Stylized 'q' Loop & Tail -->
    <circle cx="360" cy="255" r="28" fill="none" stroke="url(#ciqGrad)" stroke-width="26"/>
    <path d="M 388,230 L 388,325 C 388,345 375,355 355,355" fill="none" stroke="url(#ciqGrad)" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
